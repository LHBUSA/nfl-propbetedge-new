name = "nfl-game-picks-orchestrator"
main = "src/index.js"
compatibility_date = "2026-08-29"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
APP_ORIGIN = "https://nfl.propbetedge.ai"
NFL_GATEWAY = "https://nfl-api.propbetedge.ai"

# One quarter-hour trigger; the Worker decides from nfl-current game state
# whether a tick does work (15 min near kickoff, hourly on game day, 6h
# otherwise). No tick contacts the odds provider.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (wrangler secret put):
#   SUPABASE_SERVICE_ROLE_KEY  - database access. SET.
#
#   PICKS_INTERNAL_TOKEN       - NOT SET, and deliberately so. This gates only
#     the Pro-field enrichment in isInternal() (src/index.js:189). As of
#     2026-09-12 NOTHING presents the x-pbe-internal-token header: api/pbe-picks.js
#     reads Supabase directly with the service role key, and api/_pbe-engine-runtime.js
#     calls only the unauthenticated /v1/engine/runs. No matching variable exists
#     in the Vercel project either. The earlier claim of an active Vercel proxy
#     integration here was wrong.
#     Unset is the correct, fail-closed state: isInternal() returns false, so
#     /v1/picks/current serves entitlement="public". The customer-facing filter
#     (publication_scope=eq.official + isCustomerFacing) does NOT depend on this
#     token and applies either way.
#     Do not provision one until a caller actually presents the header; at that
#     point the SAME value must be set on both sides in the same change.

# Durable run ledger (run:tick|work|ok|err:<lane>). Isolate memory is not
# evidence that a cron ran; this namespace is.
[[kv_namespaces]]
binding = "PICKS_KV"
id = "0e7c77bc62fa477ea8d1a1608fb69a62"

# nfl-current is the only authority for season, week, kickoff and FINAL state.
[[services]]
binding = "NFL_CURRENT"
service = "nfl-current"

[observability]
enabled = true
head_sampling_rate = 1
