name = "nfl-game-picks-orchestrator"
main = "src/index.js"
compatibility_date = "2026-08-29"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
APP_ORIGIN = "https://nfl.propbetedge.ai"
NFL_GATEWAY = "https://nfl-api.propbetedge.ai"

# One quarter-hour trigger; the Worker decides from nfl-current game state
# whether a tick does work (15 min near kickoff, hourly on game day, 6h
# otherwise). No tick contacts the odds provider.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (wrangler secret put):
#   SUPABASE_SERVICE_ROLE_KEY  - database access. SET.
#
#   PICKS_INTERNAL_TOKEN       - SET. The model-read credential.
#     Authorises GET /v1/evaluations/current, which serves the sanitized Best
#     Line model snapshot to exactly one caller: the authenticated NFL Pro
#     backend in api/pbe-picks.js. Presented as `x-pbe-internal-token`.
#     The same value is set on this Worker AND in Vercel production. The browser
#     never receives it: browser -> Vercel (Pro session) -> this Worker -> KV.
#     Unset => 503 internal_token_not_configured. Fail closed; an unconfigured
#     secret never means open.
#     Kept SEPARATE from PICKS_ADMIN_TOKEN on purpose: a read credential must
#     not be able to trigger a run, and an ops credential must not be spread to
#     the web tier.
#     (Until 2026-09-12 this was deliberately unset because nothing presented
#     the header. Best Line's model layer is now that caller.)
#
#   PICKS_ADMIN_TOKEN          - OPS ONLY. Authorises POST /v1/engine/run-now,
#     the supported manual "run now" path used when debugging production so an
#     operator does not have to wait out the 6h off-hours cadence. Presented as
#     `Authorization: Bearer <token>`.
#     It bypasses the CADENCE ONLY. Champion, publication, integrity, anomaly
#     and totals gates all still apply — it calls the same runOrchestration()
#     the cron calls.
#     Unset => the endpoint fails CLOSED with 503 admin_token_not_configured.
#     An absent secret never means open.
#     Set it with, and only with:
#       npx wrangler secret put PICKS_ADMIN_TOKEN --config <this file>
#     Never in this file, never in git, never a GitHub secret.

# Durable run ledger (run:tick|work|ok|err:<lane>). Isolate memory is not
# evidence that a cron ran; this namespace is.
[[kv_namespaces]]
binding = "PICKS_KV"
id = "0e7c77bc62fa477ea8d1a1608fb69a62"

# nfl-current is the only authority for season, week, kickoff and FINAL state.
[[services]]
binding = "NFL_CURRENT"
service = "nfl-current"

[observability]
enabled = true
head_sampling_rate = 1
