name = "propbetedge-nfl-billing"
main = "src/index.js"
compatibility_date = "2026-09-11"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Keep purchase-email delivery inside Cloudflare. The service binding avoids a
# public network hop and preserves propbetedge-nfl-auth as the sole auth/email
# owner.
[[services]]
binding = "AUTH"
service = "propbetedge-nfl-auth"

[observability]
enabled = true
head_sampling_rate = 1

# Secrets — set directly on Cloudflare, never committed:
#   STRIPE_WEBHOOK_SECRET       Stripe signing secret for the NFL endpoint
#   SUPABASE_SERVICE_ROLE_KEY   server-only entitlement writes
#
# No cron. Stripe is the trigger.
# No GitHub Actions runtime. GitHub stores source; Cloudflare operates it.
