name = "propbetedge-nfl-auth"
main = "src/index-v5.js"
compatibility_date = "2026-08-29"
workers_dev = true

[vars]
APP_ORIGIN = "https://nfl.propbetedge.ai"
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Magic links are single use: one Durable Object per link jti records its first
# exchange; a reused or replayed link is refused (index-v5.js consumeMagicLink).
[[durable_objects.bindings]]
name = "MAGIC_LINKS"
class_name = "MagicLinkLedger"

[[migrations]]
tag = "v1-magic-link-ledger"
new_sqlite_classes = ["MagicLinkLedger"]
