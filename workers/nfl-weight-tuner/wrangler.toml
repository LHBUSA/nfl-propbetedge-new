name = "nfl-weight-tuner"
main = "src/index.js"
compatibility_date = "2026-08-29"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Daily after the overnight NFL window. Publication never waits on this job:
# it evaluates only finalized outcomes from the current production champion
# and either promotes a better holdout-tested reweight or leaves the incumbent.
[triggers]
crons = ["15 10 * * *"]

# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY

# Durable run ledger (run:tick|work|ok|err:<lane>). Isolate memory is not
# evidence that a cron ran; this namespace is.
[[kv_namespaces]]
binding = "PICKS_KV"
id = "0e7c77bc62fa477ea8d1a1608fb69a62"

[observability]
enabled = true
head_sampling_rate = 1
