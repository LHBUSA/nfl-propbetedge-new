name = "nfl-weight-tuner"
main = "src/index.js"
compatibility_date = "2026-08-29"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Tuesday 16:00 UTC, after Monday Night Football is final. Named day on
# purpose: Cloudflare numbers day-of-week from 1=Sunday, so the old "2" fired
# on Monday, before MNF. The hard data gate inside the Worker keeps it inert
# until the thresholds are met.
[triggers]
crons = ["0 16 * * TUE"]

# Secrets (wrangler secret put): SUPABASE_SERVICE_ROLE_KEY

# Durable run ledger (run:tick|work|ok|err:<lane>). Isolate memory is not
# evidence that a cron ran; this namespace is.
[[kv_namespaces]]
binding = "PICKS_KV"
id = "0e7c77bc62fa477ea8d1a1608fb69a62"

[observability]
enabled = true
head_sampling_rate = 1
