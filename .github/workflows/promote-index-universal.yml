name: Promote Latest NFL OS Root

on:
  push:
    branches: [main]
    paths:
      - 'index-v*.html'
      - '.github/workflows/promote-index-universal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest versioned root
        shell: bash
        run: |
          latest=$(ls -1 index-v*.html 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "No versioned root found."
            exit 1
          fi
          echo "Promoting $latest"
          cp "$latest" index.html

      - name: Commit active root if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "Active root is already current."
            exit 0
          fi
          git config user.name "PropBetEdge Build"
          git config user.email "sales@localhomebuyersusa.com"
          git add index.html
          git commit -m "Promote standalone NFL Intelligence OS root"
          git push origin HEAD:main
