name: Fix Prop Board v5.2

on:
  push:
    paths:
      - .github/workflows/fix-prop-board-v52.yml

permissions:
  contents: write

concurrency:
  group: prop-board-v52-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply Prop Board v5.2 repair
        run: python scripts/ci/fix_prop_board_v52.py

      - name: Validate Prop Board repair
        shell: bash
        run: |
          node --check prop-board-v5.js
          node --check nfl-player-media-v3.js
          node --test research/prop-board-v5.test.mjs
          git diff --check
          grep -q "const VERSION = 'v5.2.0'" prop-board-v5.js
          grep -q 'data-pbe5-headshot' prop-board-v5.js
          grep -q '>NOT MODELED<' prop-board-v5.js
          grep -q "label: 'MODELED'" prop-board-v5.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "PropBetEdge Build Bot"
          git config user.email "buildbot@propbetedge.ai"
          git rm .github/workflows/fix-prop-board-v52.yml scripts/ci/fix_prop_board_v52.py
          git add prop-board-v5.js prop-board-v5.css nfl-player-media-v3.js research/prop-board-v5.test.mjs
          git diff --cached --check
          git commit -m "Fix NFL Prop Board photos and model coverage"
          git push origin HEAD:main
