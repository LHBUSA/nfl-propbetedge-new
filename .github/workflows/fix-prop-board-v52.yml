name: Fix Prop Board v5.2

on:
  push:
    paths:
      - .github/workflows/fix-prop-board-v52.yml

permissions:
  contents: write

concurrency:
  group: prop-board-v52-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair Prop Board presentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('prop-board-v5.js')
          js = js_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global js
              if old not in js:
                  raise SystemExit(f'missing JS anchor: {label}')
              js = js.replace(old, new, 1)

          replace_once("  const VERSION = 'v5.0.0';", "  const VERSION = 'v5.2.0';", 'version')
          replace_once("  const ROSTER_KEY = 'pbe_propboard_roster_v1';", "  const ROSTER_KEY = 'pbe_propboard_roster_v2';", 'roster cache version')

          replace_once(
              "          map[name] = { team: p.team_2026 || p.team || '', position: p.position || pos.toUpperCase() };",
              "          map[name] = {\n            team: p.team_2026 || p.team || '',\n            position: p.position || pos.toUpperCase(),\n            headshot: p?.media?.headshot_url || ''\n          };",
              'roster identity media'
          )

          replace_once(
              "  const identity = name => ui.roster?.get(String(name || '').trim().toLowerCase()) || null;\n",
              "  const identity = name => ui.roster?.get(String(name || '').trim().toLowerCase()) || null;\n  function playerInitials(name) {\n    const parts = String(name || '').trim().split(/\\s+/).filter(Boolean);\n    return (parts.slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || 'PBE').slice(0, 3);\n  }\n",
              'player initials helper'
          )

          replace_once(
              "    if (modeled(row)) return { key: 'modeled', label: String(row.model.decision_status || 'MODELED').replace(/_/g, ' ').toUpperCase() };",
              "    if (modeled(row)) return { key: 'modeled', label: 'MODELED' };",
              'compact modeled status'
          )

          replace_once(
              "    if (!row.model) return `<td class=\"pbe5-td-fair\"><span class=\"pbe5-none\" title=\"No production model output for this prop. Nothing is substituted.\">—</span></td><td class=\"pbe5-td-edge\"><span class=\"pbe5-none\">—</span></td>`;",
              "    if (!row.model) return `<td class=\"pbe5-td-fair\"><span class=\"pbe5-model-na\" title=\"No production model output for this prop. Nothing is substituted.\">NOT MODELED</span></td><td class=\"pbe5-td-edge\"><span class=\"pbe5-model-na muted\">MARKET ONLY</span></td>`;",
              'explicit non-modeled cells'
          )

          old_player = '''  function playerCell(row, pinned) {
    const id = identity(row.player); const m = meta(row.market);
    return `<div class="pbe5-player">
      <button type="button" class="pbe5-pin ${pinned ? 'on' : ''}" data-pbe5-pin="${esc(row.key)}" aria-pressed="${pinned ? 'true' : 'false'}" aria-label="${pinned ? 'Unpin' : 'Pin'} ${esc(row.player)} ${esc(m.label)}">${pinned ? '★' : '☆'}</button>
      <div><a href="javascript:void(0)" class="pbe5-name" data-pbe5-player="${esc(row.player)}">${esc(row.player)}</a><small>${id ? `${esc(id.team)} · ${esc(id.position)} · ` : ''}${esc(m.label)}</small></div>
    </div>`;
  }
'''
          new_player = '''  function playerCell(row, pinned) {
    const id = identity(row.player); const m = meta(row.market); const initials = playerInitials(row.player);
    const photo = id?.headshot ? `<img data-pbe5-headshot="1" src="${esc(id.headshot)}" alt="" width="48" height="48" loading="lazy" decoding="async" aria-hidden="true">` : '';
    return `<div class="pbe5-player">
      <button type="button" class="pbe5-pin ${pinned ? 'on' : ''}" data-pbe5-pin="${esc(row.key)}" aria-pressed="${pinned ? 'true' : 'false'}" aria-label="${pinned ? 'Unpin' : 'Pin'} ${esc(row.player)} ${esc(m.label)}">${pinned ? '★' : '☆'}</button>
      <span class="pbe5-avatar ${photo ? 'has-photo' : 'is-fallback'}" aria-hidden="true"><span>${esc(initials)}</span>${photo}</span>
      <div class="pbe5-player-copy"><a href="javascript:void(0)" class="pbe5-name" data-pbe5-player="${esc(row.player)}">${esc(row.player)}</a><small>${id ? `${esc(id.team)} · ${esc(id.position)} · ` : ''}${esc(m.label)}</small></div>
    </div>`;
  }
'''
          replace_once(old_player, new_player, 'player identity cell')

          replace_once(
              "    return `<tr class=\"pbe5-row ${open ? 'is-open' : ''} ${pinned ? 'is-pinned' : ''}\" data-pbe5-row=\"${esc(row.key)}\" aria-expanded=\"${open ? 'true' : 'false'}\">",
              "    return `<tr class=\"pbe5-row ${open ? 'is-open' : ''} ${pinned ? 'is-pinned' : ''} ${modeled(row) ? 'is-modeled' : ''}\" data-pbe5-row=\"${esc(row.key)}\" aria-expanded=\"${open ? 'true' : 'false'}\">",
              'modeled table row class'
          )

          replace_once(
              "      <td class=\"pbe5-td-status\"><span class=\"pbe5-status ${st.key}\">${esc(st.label)}</span><i class=\"pbe5-chev\" aria-hidden=\"true\"></i></td>",
              "      <td class=\"pbe5-td-status\"><div class=\"pbe5-status-wrap\"><span class=\"pbe5-status ${st.key}\">${esc(st.label)}</span><i class=\"pbe5-chev\" aria-hidden=\"true\"></i></div></td>",
              'status wrapper'
          )

          replace_once(
              "      : !row.model ? `<div><span>PBE fair</span><b class=\"pbe5-none\">—</b></div><div><span>Edge</span><b class=\"pbe5-none\">—</b></div>`",
              "      : !row.model ? `<div class=\"pbe5-card-model-note\"><b>MARKET ONLY</b><span>No PBE model output has been published for this prop.</span></div>`",
              'card non-modeled explanation'
          )

          replace_once(
              "    return `<article class=\"pbe5-card ${open ? 'is-open' : ''} ${pinned ? 'is-pinned' : ''}\" data-pbe5-row=\"${esc(row.key)}\" aria-expanded=\"${open ? 'true' : 'false'}\">",
              "    return `<article class=\"pbe5-card ${open ? 'is-open' : ''} ${pinned ? 'is-pinned' : ''} ${modeled(row) ? 'is-modeled' : ''}\" data-pbe5-row=\"${esc(row.key)}\" aria-expanded=\"${open ? 'true' : 'false'}\">",
              'modeled card class'
          )

          replace_once(
              "  function onKey(event) { if (event.key !== 'Enter' && event.key !== ' ') return; const row = event.target.closest?.('[data-pbe5-row], [data-pbe5-open]'); if (!row || event.target.closest('a, button, input, select')) return; event.preventDefault(); toggleRow(row.dataset.pbe5Row || row.dataset.pbe5Open); }\n\n  function install() {",
              "  function onKey(event) { if (event.key !== 'Enter' && event.key !== ' ') return; const row = event.target.closest?.('[data-pbe5-row], [data-pbe5-open]'); if (!row || event.target.closest('a, button, input, select')) return; event.preventDefault(); toggleRow(row.dataset.pbe5Row || row.dataset.pbe5Open); }\n  function onImageError(event) {\n    const img = event.target?.closest?.('img[data-pbe5-headshot]');\n    if (!img || !root()?.contains(img)) return;\n    const avatar = img.closest('.pbe5-avatar');\n    img.remove();\n    avatar?.classList.remove('has-photo');\n    avatar?.classList.add('is-fallback');\n  }\n\n  function install() {",
              'image failure handler'
          )

          replace_once(
              "  document.addEventListener('keydown', onKey);\n  window.addEventListener('resize', onResize);",
              "  document.addEventListener('keydown', onKey);\n  document.addEventListener('error', onImageError, true);\n  window.addEventListener('resize', onResize);",
              'image error listener'
          )

          js_path.write_text(js, encoding='utf-8')

          css_path = Path('prop-board-v5.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.pbe5-table th:nth-child(1){width:30%}\n.pbe5-table th:nth-child(2){width:11%}\n.pbe5-table th:nth-child(3),.pbe5-table th:nth-child(4){width:15%}\n.pbe5-table th:nth-child(5){width:9%}\n.pbe5-table th:nth-child(6){width:9%}\n.pbe5-table th:nth-child(7){width:11%}', '.pbe5-table th:nth-child(1){width:28%}\n.pbe5-table th:nth-child(2){width:11%}\n.pbe5-table th:nth-child(3),.pbe5-table th:nth-child(4){width:15%}\n.pbe5-table th:nth-child(5){width:9%}\n.pbe5-table th:nth-child(6){width:9%}\n.pbe5-table th:nth-child(7){width:13%}', 1)
          css = css.replace('.pbe5-td-status{white-space:nowrap}\n.pbe5-status{display:inline-block;padding:4px 7px;border-radius:5px;font:700 10.5px/1 var(--pbe-font-data);letter-spacing:.08em;text-transform:uppercase;color:var(--pbe-dim);border:1px solid var(--pbe-line)}', '.pbe5-td-status{white-space:nowrap;overflow:visible}\n.pbe5-status-wrap{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}\n.pbe5-status{display:inline-flex;align-items:center;max-width:100%;padding:5px 8px;border-radius:999px;font:700 10.5px/1 var(--pbe-font-data);letter-spacing:.07em;text-transform:uppercase;color:var(--pbe-dim);border:1px solid var(--pbe-line);white-space:nowrap}', 1)

          marker = '/* ---- Prop Board v5.2: player identity + explicit model coverage ---- */'
          if marker in css:
              raise SystemExit('v5.2 CSS already present')
          css += r'''

/* ---- Prop Board v5.2: player identity + explicit model coverage ---- */
.pbe5-player-copy{min-width:0;flex:1 1 auto}
.pbe5-avatar{position:relative;display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;overflow:hidden;border:1px solid var(--pbe-line-strong);border-radius:11px;background:linear-gradient(145deg,var(--pbe-ink-3),var(--pbe-ink-4));box-shadow:0 7px 18px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035);transition:border-color .15s,transform .15s}
.pbe5-avatar>span{color:var(--pbe-gold);font:800 11px/1 var(--pbe-font-data);letter-spacing:.04em}
.pbe5-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;background:var(--pbe-ink-4)}
.pbe5-avatar.has-photo>span{opacity:.12}
.pbe5-avatar.is-fallback{border-style:dashed}
.pbe5-row:hover .pbe5-avatar,.pbe5-row.is-open .pbe5-avatar{border-color:rgba(212,175,55,.48)}
.pbe5-row.is-modeled td:first-child{box-shadow:inset 2px 0 0 var(--pbe-model)}
.pbe5-model-na{display:inline-flex;align-items:center;min-height:22px;padding:4px 6px;border:1px solid var(--pbe-line);border-radius:5px;color:var(--pbe-faint);font:700 10px/1 var(--pbe-font-data);letter-spacing:.05em;white-space:nowrap}
.pbe5-model-na.muted{border-color:transparent;padding-left:0;padding-right:0;color:var(--pbe-unavailable)}
.pbe5-card-model-note{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border:1px solid var(--pbe-line);border-radius:7px;background:var(--pbe-ink-4)}
.pbe5-card-model-note b{color:var(--pbe-faint);font:800 10px/1 var(--pbe-font-data);letter-spacing:.08em}
.pbe5-card-model-note span{color:var(--pbe-dim);font-size:11px;line-height:1.35;text-align:right}
.pbe5-card.is-modeled{border-color:rgba(79,180,226,.28);box-shadow:inset 2px 0 0 var(--pbe-model),0 14px 32px rgba(0,0,0,.17)}
@media(max-width:1180px){.pbe5-avatar{width:41px;height:41px;flex-basis:41px;border-radius:9px}.pbe5-model-na{font-size:10px;letter-spacing:.03em}}
@media(max-width:760px){.pbe5-card .pbe5-avatar{width:52px;height:52px;flex-basis:52px;border-radius:12px}.pbe5-card-model-note{align-items:flex-start;flex-direction:column}.pbe5-card-model-note span{text-align:left}}
@media(prefers-reduced-motion:reduce){.pbe5-avatar{transition:none}.pbe5-row:hover .pbe5-avatar{transform:none}}
'''
          css_path.write_text(css, encoding='utf-8')

          media_path = Path('nfl-player-media-v3.js')
          media = media_path.read_text(encoding='utf-8')
          old = "    if(el.querySelector(':scope > .pbe-player-headshot')){el.dataset.pbeMediaV3='ready';return}"
          new = "    if(el.querySelector(':scope > .pbe5-avatar')||el.querySelector(':scope > .pbe-player-headshot')){el.dataset.pbeMediaV3='ready';return}"
          if old not in media:
              raise SystemExit('missing universal media duplicate guard anchor')
          media = media.replace(old, new, 1)
          media_path.write_text(media, encoding='utf-8')

          test_path = Path('research/prop-board-v5.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          anchor = "test('pins and settings keep the existing localStorage keys so nothing a user pinned is lost', () => {"
          addition = r'''test('player rows carry canonical DNA headshots with an in-board fallback', () => {
  assert.match(v5, /media\?\.headshot_url/);
  assert.match(v5, /data-pbe5-headshot/);
  assert.match(v5, /pbe5-avatar/);
  assert.match(v5, /playerInitials/);
  assert.match(css, /Prop Board v5\.2: player identity/);
});

test('model coverage is explicit and long backend decision labels cannot clip the Status column', () => {
  assert.match(v5, /label: 'MODELED'/);
  assert.match(v5, />NOT MODELED</);
  assert.match(v5, />MARKET ONLY</);
  assert.match(v5, /pbe5-status-wrap/);
  assert.match(css, /\.pbe5-status-wrap/);
});

'''
          if anchor not in test:
              raise SystemExit('missing Prop Board test insertion anchor')
          test = test.replace(anchor, addition + anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Validate Prop Board repair
        shell: bash
        run: |
          node --check prop-board-v5.js
          node --check nfl-player-media-v3.js
          node --test research/prop-board-v5.test.mjs
          git diff --check
          grep -q "const VERSION = 'v5.2.0'" prop-board-v5.js
          grep -q 'data-pbe5-headshot' prop-board-v5.js
          grep -q '>NOT MODELED<' prop-board-v5.js
          grep -q "label: 'MODELED'" prop-board-v5.js

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "PropBetEdge Build Bot"
          git config user.email "buildbot@propbetedge.ai"
          git rm .github/workflows/fix-prop-board-v52.yml
          git add prop-board-v5.js prop-board-v5.css nfl-player-media-v3.js research/prop-board-v5.test.mjs
          git diff --cached --check
          git commit -m "Fix NFL Prop Board photos and model coverage"
          git push origin HEAD:main
