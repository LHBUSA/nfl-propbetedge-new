name: Temporary NFL PropSports Attribution QA

on:
  push:
    branches:
      - fix/nfl-propsports-attribution-20260920

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Public attribution regression
        run: node --test tests/nfl-public-attribution.test.mjs
      - name: Syntax checks
        run: |
          node --check pbecast-v6.js
          node --check production-polish-v2.js
          node --check propchain-core-v3.js
          node --check workers/nfl-intel/src/changes-core.js
          node --check page-loader.js
