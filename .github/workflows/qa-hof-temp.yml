name: Temporary Hall Source QA

on:
  push:
    branches:
      - fix/hof-provenanced-20260920

permissions:
  contents: write

jobs:
  hof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hof-provenanced-20260920
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build rights-clean Hall release snapshot when absent
        run: |
          if [ ! -s data/dist/hof-members.v1.json ]; then
            node scripts/build-hof-snapshot.mjs
          else
            echo "Hall release snapshot already present."
          fi
      - name: Hall unit and provenance regressions
        run: node --test tests/hof-history.test.mjs tests/nfl-history-provenance.test.mjs
      - name: Validate production Hall handler against release snapshot
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import handler from './api/hof-history.js';

          let body = '';
          const headers = {};
          const res = {
            statusCode: 200,
            setHeader(k, v) { headers[String(k).toLowerCase()] = String(v); },
            end(v='') { body += String(v); }
          };

          handler({ method: 'GET', query: {} }, res);
          const json = JSON.parse(body);
          assert.equal(res.statusCode, 200, JSON.stringify(json));
          assert.equal(json.ok, true);
          assert.equal(json.contract, 'pbe-nfl-hof-v1');
          assert.equal(json.semantics, 'RELEASE_SNAPSHOT');
          assert.equal(json.source?.source_id, 'src_wikidata');
          assert.equal(json.source?.property, 'P6930');
          assert.ok(Number(json.count) >= 100, 'Hall snapshot returned too few members');
          assert.equal(json.members.length, json.count);
          assert.ok(json.members.every(m => /^Q\d+$/.test(m.qid) && m.name && m.hof_id));
          console.log('HOF RELEASE HANDLER PASS', {
            count: json.count,
            retrieved_at: json.source.retrieved_at,
            sha256: json.content_sha256
          });
          NODE
      - name: Commit generated Hall snapshot
        run: |
          if git status --porcelain -- data/dist/hof-members.v1.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/dist/hof-members.v1.json
            git commit -m "Add sourced Hall of Fame release snapshot"
            git push origin HEAD:fix/hof-provenanced-20260920
          else
            echo "No Hall snapshot change to commit."
          fi
