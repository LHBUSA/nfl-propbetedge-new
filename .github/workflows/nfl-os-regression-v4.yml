name: NFL OS Regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Canonical validation gate for the broadcast-first NFL build and committed archive snapshot.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every local JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*' -print0)

      - name: Require fully standalone root
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'nfl-intelligence-os-standalone-v3-local-archive' index.html
          grep -Fq './app-core-v3.js' index.html
          grep -Fq './page-loader.js' index.html
          grep -Fq './paywall.js' index.html
          grep -Fq './archive/teams.js' index.html
          if grep -Fq 'https://nfl.propbetedge.ai/js/' index.html; then
            echo 'Old NFL production runtime dependency found in active root.'
            exit 1
          fi

      - name: Forbid retired fake-live and rejected shell modules
        shell: bash
        run: |
          set -euo pipefail
          banned=(
            'js/data/live-data.js'
            'js/views/home.js'
            'js/views/picks.js'
            'js/views/propchain.js'
            'js/views/pbecast.js'
            'js/views/injuries.js'
            'js/views/trades.js'
            'js/views/player-modal.js'
            'js/components/ticker.js'
            'js/components/search.js'
            'js/app.js'
            'game-center-v2.js'
            'dashboard-v4.js'
          )
          for token in "${banned[@]}"; do
            if grep -Fq "$token" index.html || grep -Fq "$token" page-loader.js; then
              echo "Retired/rejected runtime import found: $token"
              exit 1
            fi
          done

      - name: Forbid randomized product behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules 'Math\.random' .; then
            echo 'Math.random is forbidden in NFL product runtime.'
            exit 1
          fi

      - name: Require frozen archive snapshot
        shell: bash
        run: |
          set -euo pipefail
          required=(archive/utils.js archive/teams.js archive/superbowls.js archive/hof.js archive/seasons.js archive/records.js archive/stats-2025.js archive/standings-2025.js)
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing archive asset: $file"; exit 1; }
          done

      - name: Require active broadcast-first product modules
        shell: bash
        run: |
          set -euo pipefail
          required=(
            dashboard-v5.js
            sports-shell-v2.js
            pbecast-v4.js
            games-v2.js
            team-research-v3.js
            prop-board-v3.js
            market-watch-v2.js
            matchups-v2.js
            model-lab.js
            simulator-v2.js
            sgp-lab-v2.js
            usage-v2.js
            propchain-v2.js
            news-intelligence-v2.js
            newsroom-v2.js
            player-research-v2.js
            command-palette-v3.js
            event-selector-v2.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing product module: $file"; exit 1; }
            if ! grep -Fq "$file" page-loader.js && ! grep -Fq "$file" index.html; then
              echo "Product module is not active: $file"
              exit 1
            fi
          done
          test -s dashboard-v5.css
          test -s sports-shell-v1.css
          test -s pbecast-v4.css

      - name: Validate CSS-referenced local assets
        shell: bash
        run: |
          set -euo pipefail
          test -s world-class-v1.css
          grep -Fq 'world-class-v1.css' page-loader.js

          # Every local url() in the visual stylesheet must resolve, be large
          # enough to be real, and (for WebP) not be truncated. Hero imagery is
          # optional: zero references is a valid, passing state. The gradient-only
          # design is deliberate until approved photography exists.
          MIN_BYTES=40960
          CSS=world-class-v1.css
          BASE=$(dirname "$CSS")

          mapfile -t refs < <(
            grep -o 'url([^)]*)' "$CSS"               | sed -e 's/^url(//' -e 's/)$//' -e "s/^[[:space:]]*['\"]\?//" -e "s/['\"]\?[[:space:]]*$//"               | sort -u
          )

          if [ "${#refs[@]}" -eq 0 ]; then
            echo "No url() references in $CSS - nothing to validate."
            exit 0
          fi

          fail=0
          for ref in "${refs[@]}"; do
            case "$ref" in
              data:*|http://*|https://*|//*)
                echo "SKIP      $ref (remote or inline)"
                continue
                ;;
              /*)  path="${ref#/}" ;;
              *)   path="$BASE/${ref#./}" ;;
            esac

            if [ ! -f "$path" ]; then
              echo "MISSING   $ref -> $path"
              fail=1
              continue
            fi

            bytes=$(stat -c%s "$path")
            if [ "$bytes" -lt "$MIN_BYTES" ]; then
              echo "UNDERSIZE $path is ${bytes}B, floor is ${MIN_BYTES}B"
              fail=1
              continue
            fi

            # WebP carries its own length in the RIFF header. If the file on
            # disk is shorter, it was truncated in transit - the exact defect
            # that shipped three undecodable heroes past a bare -s check.
            if [ "${path##*.}" = "webp" ]; then
              declared=$(python3 -c "import struct,sys; f=open(sys.argv[1],'rb'); f.seek(4); print(struct.unpack('<I', f.read(4))[0] + 8)" "$path")
              if [ "$bytes" -lt "$declared" ]; then
                echo "TRUNCATED $path is ${bytes}B but RIFF declares ${declared}B"
                fail=1
                continue
              fi
            fi

            echo "OK        $path (${bytes}B)"
          done

          if [ "$fail" -ne 0 ]; then
            echo "$CSS references missing, undersized or truncated assets"
            exit 1
          fi

      - name: Require live PBEcast transport and visuals
        shell: bash
        run: |
          set -euo pipefail
          test -s api/nfl-live.js
          grep -Fq 'Full Play-by-Play' pbecast-v4.js
          grep -Fq 'current_drive' pbecast-v4.js
          grep -Fq 'current_play' pbecast-v4.js
          grep -Fq 'player_stats' pbecast-v4.js
          grep -Fq 'espn_cdn_gamepackage' api/nfl-live.js
          grep -Fq "return'LIVE'" api/nfl-live.js
          grep -Fq "transport:'poll'" api/nfl-live.js

      - name: Require sports broadcast hierarchy
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'pbes-scorebar' sports-shell-v1.js
          grep -Fq 'PBEcast' sports-shell-v1.js
          grep -Fq 'Tonight in the NFL' dashboard-v5.js
          grep -Fq 'FEATURED GAME' dashboard-v5.js
          grep -Fq 'headshot' dashboard-v5.js
          grep -Fq 'PBEcastV4' dashboard-v5.js

      - name: Require premium and newsroom server gates
        shell: bash
        run: |
          set -euo pipefail
          test -s api/pro-model.js
          test -s api/news-feed.js
          grep -Fq 'nfl_has_pro_access' api/pro-model.js
          grep -Fq 'propbet-news-api' api/news-feed.js

      - name: Require truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fiq 'causality unproven' propchain-v2.js
          grep -Fiq 'model derived' simulator-v2.js
          grep -Fiq 'correlation model unavailable' sgp-lab-v2.js
          grep -Fiq 'target share' usage-v2.js
          grep -Fiq 'no fake board' draft-review-v2.js
          grep -Fiq 'local baseline' market-watch-v2.js
          grep -Fiq 'score feed says so' games-v2.js
          grep -Fiq 'current roster is not inferred' team-research-v3.js
          grep -Fiq 'LIVE is rendered only' pbecast-v4.js

      - name: Validate Vercel configuration
        shell: bash
        run: |
          if [ -f vercel.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          fi
