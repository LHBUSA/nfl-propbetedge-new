name: NFL OS Regression

on:
  push:
    branches:
      - main
      - recovery/baseline-d29ff748
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check every local JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path './.git/*')
          node scripts/check-syntax.mjs "${files[@]}"

      - name: Require fully standalone root
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq './app-core-v3.js' index.html
          grep -Fq './page-loader.js' index.html
          grep -Fq './paywall.js' index.html
          for dataset in utils teams superbowls hof seasons records stats-2025 standings-2025; do
            grep -Eq "src=\"\./archive/${dataset}\.js" index.html || { echo "Missing local archive dataset: ${dataset}"; exit 1; }
          done
          ! grep -Eq 'src="https?://[^"]*/archive/' index.html
          ! grep -Fq 'https://nfl.propbetedge.ai/js/' index.html

      - name: Forbid randomized product behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules 'Math\.random' .; then
            echo 'Math.random is forbidden in NFL product runtime.'
            exit 1
          fi

      - name: Require recovered product authorities
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq "const VERSION='20[0-9]{6}[A-Za-z0-9-]+'" page-loader.js
          required=(
            dashboard-v5.js dashboard-v6.js dashboard-v7.js dashboard-v8-enhance.js
            sports-shell-v2.js sports-shell-auth-state.js
            games-v2.js games-command-v4.js games-intel-v5.js
            prop-board-v3.js prop-board-v4.js market-watch-v3.js matchups-v2.js
            model-lab.js model-lab-v2-enhance.js simulator-v2.js simulator-v3-enhance.js
            sgp-lab-v2.js usage-v2.js propchain-v2.js
            pbecast-v6.js pbecast-v7-enhance.js
            news-intelligence-v2.js newsroom-v2.js injury-intel-v2.js player-research-v2.js
            pbe-picks-v2.js pbe-validation-v1.js
            pbe-engine-story-v1.js pbe-prop-engine-v1.js
            nfl-brand-media-v2.js nfl-player-media-v3.js
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing product module: $file"; exit 1; }
            if ! grep -Fq "$file" page-loader.js && ! grep -Fq "$file" index.html; then
              echo "Product module is not active: $file"
              exit 1
            fi
          done
          grep -Fq 'PBEcastV6?.focus' dashboard-v5.js
          grep -Fq 'PBEcastV6?.focus' sports-shell-v2.js
          grep -Fq "['pbepicks','PBE Picks'" sports-shell-v2.js
          grep -Fq "['trackrecord','Track Record'" sports-shell-v2.js
          grep -Fq "['propchain','PropChain'" sports-shell-v2.js
          grep -Fq '.pbe-v2-quicknav{display:none!important}' global-polish-v2.css
          grep -Fq 'new Proxy(rawViews' app-core-v3.js
          grep -Fq 'pendingRoute' app-core-v3.js
          grep -Fq 'replayPendingRoute' page-loader.js
          grep -Fq "if(item.js==='./dashboard-v7.js'" page-loader.js

      - name: Require intended visual authority order
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('page-loader.js','utf8');
          const at=f=>src.indexOf(`'./${f}'`);
          const world=at('world-class-v1.css');
          const foundations=['dashboard-v7.css','dashboard-v8-enhance.css','games-v2.css','model-lab-v2-enhance.css','simulator-v3-enhance.css','usage-v2.css'];
          const terminal=['pbecast-v6.css','pbecast-v7-enhance.css','games-command-v4.css','games-intel-v5.css','prop-board-v4.css','prop-board-responsive-v5.css','pbe-picks-v2.css'];
          if(world<0) throw new Error('world-class visual layer missing');
          for(const f of foundations) if(at(f)<0||at(f)>world) throw new Error(`${f} must load before world-class-v1.css`);
          for(const f of terminal) if(at(f)<world) throw new Error(`${f} must load after world-class-v1.css`);
          console.log('Recovered layered visual authority OK');
          NODE

      - name: Observer safety across all active client modules
        run: node scripts/scan-observers.mjs

      - name: Prop engine unit tests
        run: node --test tests/nfl-prop-picker.test.mjs tests/nfl-prop-grader.test.mjs tests/nfl-prop-tuner.test.mjs

      - name: Require live PBEcast and truth boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s api/nfl-live.js
          grep -Fq "const LIVE_API='/api/nfl-live'" pbecast-v6.js
          grep -Fq 'current_play' pbecast-v6.js
          grep -Fq 'current_drive' pbecast-v6.js
          grep -Fq 'player_stats' pbecast-v6.js
          grep -Fq "function isLive(d=state.detail){return semantics(d)==='LIVE'}" pbecast-v6.js
          grep -Fq 'espn_cdn_gamepackage' api/nfl-live.js
          grep -Fiq 'causality unproven' propchain-v2.js
          grep -Fiq 'model derived' simulator-v2.js
          grep -Fiq 'correlation model unavailable' sgp-lab-v2.js
          grep -Fiq 'target share' usage-v2.js
          grep -Fiq 'local baseline' market-watch-v3.js
          grep -Fiq 'current roster is not inferred' team-research-v3.js

      - name: Require premium server authority
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "from './_nfl-auth.js'" api/pro-model.js
          grep -Fq 'getNflSession' api/pro-model.js
          grep -Fq 'sign_in_required' api/pro-model.js
          grep -Fq 'nfl_pro_required' api/pro-model.js
          for f in api/*.js; do
            case "$(basename "$f")" in _nfl-auth.js|auth-diag.js) continue ;; esac
            if grep -Fq 'createHmac' "$f"; then echo "Duplicate auth logic in $f"; exit 1; fi
          done

      - name: Validate Vercel configuration
        shell: bash
        run: |
          if [ -f vercel.json ]; then node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"; fi
