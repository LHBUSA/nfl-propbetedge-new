name: NFL OS Truth Gate v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check local JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -print0)

      - name: Block legacy fake-live runtime imports
        shell: bash
        run: |
          set -euo pipefail
          banned=(
            'js/data/live-data.js'
            'js/views/home.js'
            'js/views/picks.js'
            'js/views/propchain.js'
            'js/views/pbecast.js'
            'js/views/injuries.js'
            'js/views/trades.js'
            'js/views/player-modal.js'
            'js/components/ticker.js'
            'js/components/search.js'
            'js/app.js'
          )
          for token in "${banned[@]}"; do
            if grep -Fq "$token" index.html; then
              echo "ERROR: standalone root reintroduced legacy runtime: $token"
              exit 1
            fi
          done

      - name: Block random betting behavior
        shell: bash
        run: |
          set -euo pipefail
          if grep -R --line-number --exclude-dir=.git --exclude='*.yml' --exclude='*.yaml' 'Math\.random' .; then
            echo 'ERROR: Math.random found in product runtime.'
            exit 1
          fi

      - name: Require standalone app core and Pro gate
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq './app-core-v3.js' index.html
          grep -Fq './paywall.js' index.html
          grep -Fq './page-loader.js' index.html
          test -f api/pro-model.js
          test -f api/news-feed.js

      - name: Require current NFL OS product modules
        shell: bash
        run: |
          set -euo pipefail
          required=(
            'prop-board-v3.js'
            'model-lab.js'
            'market-watch-v2.js'
            'matchups-v2.js'
            'simulator-v2.js'
            'sgp-lab-v2.js'
            'usage-v2.js'
            'propchain-v2.js'
            'game-center-v2.js'
            'newsroom-v2.js'
            'player-research-v2.js'
            'command-palette-v3.js'
            'event-selector-v2.js'
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required module: $file"; exit 1; }
            grep -Fq "$file" page-loader.js || grep -Fq "$file" index.html || { echo "Module is not activated: $file"; exit 1; }
          done

      - name: Require truth labels for incomplete intelligence
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'CAUSALITY UNPROVEN' propchain-v2.js
          grep -Fq 'MODEL DERIVED' simulator-v2.js
          grep -Fq 'Correlation model unavailable' sgp-lab-v2.js
          grep -Fq 'current target share/usage remains unavailable' usage-v2.js
          grep -Fq 'No fake board' draft-review-v2.js

      - name: Validate Vercel configuration JSON
        shell: bash
        run: |
          if [ -f vercel.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json valid')"
          fi
