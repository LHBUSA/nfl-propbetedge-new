name: NFL Post-Deploy Smoke

# A REAL post-deploy hook.
#
# Every other workflow in this repo triggers on `push`, which starts at the same
# moment Vercel starts building. Those runs therefore race the deploy and can
# pass against the PREVIOUS build — which is exactly how a main-thread freeze
# reached production while CI was green.
#
# `deployment_status` fires only once the deployment provider reports a result,
# so this runs against the build that is actually live, at the URL that is
# actually serving it.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Target URL to smoke
        required: false
        default: https://nfl.propbetedge.ai

permissions:
  contents: read

jobs:
  smoke:
    # Only on a successful production deployment. Previews and failed builds
    # are skipped rather than reported as smoke failures.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve target URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            url="${{ github.event.inputs.url }}"
          else
            # Prefer the alias the product is actually served on.
            url="https://nfl.propbetedge.ai"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Smoking $url"

      # Access V2 (1551b3a): no site-wide wall. The live deployment is asked
      # only what an anonymous reader and a forged owner session can ask:
      # public shell up, every premium read 401 with no premium body, the model
      # host refusing callers without the server credential, and the public
      # Track Record contract (gate counts, validation and official totals
      # separate, official record official-only, no decision content).
      - name: Access boundaries and public Track Record contract (live)
        env:
          PBE_URL: ${{ steps.target.outputs.url }}
        run: node scripts/nfl-access-boundary-smoke.mjs

      # 403 (signed in, no purchase), 503 (entitlement unavailable) and the
      # entitled-Pro path cannot be produced in production without a real
      # subscriber session, and the workflow never mints one. They run here
      # against the handler code this deployment was built from.
      - name: Access contract for non-entitled, unavailable and Pro readers (deployed handlers)
        run: >-
          node --test tests/nfl-auth-access-v2.test.mjs tests/nfl-auth-model-boundary.test.mjs
          tests/nfl-auth-smoke-contract.test.mjs tests/pbe-track-record-v3.test.mjs

      # A wedged renderer cannot answer 1+1. This asserts liveness directly
      # rather than inferring it from a screenshot or a timeout. It also walks
      # the anonymous public surfaces and the Pro boundary at 1440 and 390.
      - name: Browser liveness and route soak against the live deployment
        env:
          PBE_URL: ${{ steps.target.outputs.url }}
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/recovery-browser-smoke.mjs

      - name: Real logo audit across every live route
        env:
          PBE_URL: ${{ steps.target.outputs.url }}
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/real-logo-browser-gate.mjs

      - name: Observer loop alarm must be silent
        env:
          PBE_URL: ${{ steps.target.outputs.url }}
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/observer-alarm-check.mjs

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-smoke
          path: |
            access-boundary.log
            recovery-smoke.log
            real-logo-audit.log
            observer-alarm.log
            recovery-*.png
            real-logo-*.png
          if-no-files-found: ignore
