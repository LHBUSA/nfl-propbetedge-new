name: Recovery Browser Smoke

on:
  push:
    branches:
      - recovery/baseline-d29ff748

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production APIs are reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://nfl.propbetedge.ai/api/nfl-live?date=20260830' | grep -Fq '"ok":true'
      - name: Browser liveness, media, routes and visual captures
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/recovery-browser-smoke.mjs
      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-browser-audit
          path: |
            recovery-smoke.log
            recovery-*.png
          if-no-files-found: ignore
