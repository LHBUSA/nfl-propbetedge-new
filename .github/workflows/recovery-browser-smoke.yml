name: NFL Browser Visual Regression

on:
  push:
    branches:
      - main
      - recovery/baseline-d29ff748
      - fix/injuries-photo-layout-v2
      - fix/injury-editorial-hub-v3
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime syntax
        run: |
          node --check page-loader.js
          node --check injury-intel-v2.js
          node --check scripts/injury-layout-smoke.mjs
          node scripts/check-syntax.mjs \
            injury-command-center-v1.js injury-readability-v5.js \
            workers/nfl-intel/src/index.js workers/nfl-intel/src/injury-board.js \
            workers/nfl-gateway/index.js

      - name: Observer safety across active runtime
        run: node scripts/scan-observers.mjs

      - name: Prop engine unit tests
        run: node --test tests/nfl-prop-picker.test.mjs tests/nfl-prop-grader.test.mjs tests/nfl-prop-tuner.test.mjs

      - name: Verify production APIs are reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://nfl.propbetedge.ai/api/nfl-live?date=20260830' | grep -Fq '"ok":true'

      - name: Browser liveness media nav routes and visual captures
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/recovery-browser-smoke.mjs

      # NFL paywall + Best Line player props in real Chrome at 1440 and 390,
      # against the branch's own API handlers (scripts/nfl-access-local-server.mjs).
      # fixture: synthetic kickoff-relative odds through the real nfl-odds and
      # nfl-intel code; live: public gateway snapshot for the subscriber route soak.
      - name: NFL paywall and Best Line browser gate
        env:
          PBE_CHROME: /usr/bin/google-chrome
          PBE_QA_OUT: qa-paywall
        shell: bash
        run: |
          set -euo pipefail
          node scripts/nfl-access-local-server.mjs --port 8791 --odds fixture > qa-harness-fixture.log 2>&1 &
          node scripts/nfl-access-local-server.mjs --port 8792 --odds live > qa-harness-live.log 2>&1 &
          for port in 8791 8792; do for i in $(seq 1 60); do curl -fsS "http://localhost:$port/api/auth-session" >/dev/null && break; sleep 1; done; done
          PBE_QA_SCENARIOS=wall,bypass,signedin,denied,outage,pass,cancel,bestline,canaries node scripts/nfl-paywall-browser-gate.mjs http://localhost:8791
          PBE_QA_SCENARIOS=subscriber node scripts/nfl-paywall-browser-gate.mjs http://localhost:8792
          node scripts/nfl-paywall-live-canary.mjs http://localhost:8791

      # The PBE Card canary harness in real Chrome against a local stand-in
      # origin: a closed original tab must not end the run, Chrome exiting
      # must fail fast, and every profile must be destroyed.
      - name: PBE Card canary harness lifecycle
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node --test --test-concurrency=1 tests/pbe-card-gate-harness.test.mjs

      # Fixture-backed: team alias mapping and the honest unknown team cell,
      # independent of whatever the live news feed carries today.
      - name: Injury availability team column (fixture)
        run: node --test tests/injury-team-column.test.mjs

      - name: Injury Editorial article layout
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/injury-layout-smoke.mjs

      - name: Upload visual regression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-browser-visual-audit
          path: |
            recovery-smoke.log
            recovery-*.png
            qa-paywall/*
            qa-harness-*.log
            injury-layout-*.png
            injury-editorial-*.png
          if-no-files-found: ignore
