name: NFL Browser Visual Regression

on:
  push:
    branches:
      - main
      - recovery/baseline-d29ff748
      - fix/injuries-photo-layout-v2
      - fix/injury-editorial-hub-v3
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Runtime syntax
        run: |
          node --check page-loader.js
          node --check injury-intel-v2.js
          node --check scripts/injury-layout-smoke.mjs

      - name: Observer safety across active runtime
        run: node scripts/scan-observers.mjs

      - name: Prop engine unit tests
        run: node --test tests/nfl-prop-picker.test.mjs tests/nfl-prop-grader.test.mjs tests/nfl-prop-tuner.test.mjs

      - name: Verify production APIs are reachable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://nfl.propbetedge.ai/api/nfl-live?date=20260830' | grep -Fq '"ok":true'

      - name: Browser liveness media nav routes and visual captures
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/recovery-browser-smoke.mjs

      - name: Injury Editorial article layout
        env:
          PBE_CHROME: /usr/bin/google-chrome
        run: node scripts/injury-layout-smoke.mjs

      - name: Upload visual regression audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-browser-visual-audit
          path: |
            recovery-smoke.log
            recovery-*.png
            injury-layout-*.png
            injury-editorial-*.png
          if-no-files-found: ignore
