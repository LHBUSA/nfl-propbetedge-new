name: NFL Frontend CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `node --check` on a .js file containing ESM import/export does NOT
      # reliably fail: an error placed AFTER an import statement exits 0.
      # Verified against api/auth-session.js with an injected error — the old
      # gate passed it, scripts/check-syntax.mjs caught it. package.json sets
      # "type": "module", so every api/*.js file sat in that blind spot.
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node scripts/check-syntax.mjs \
            app-core-v3.js page-loader.js paywall.js paywall-funnel-v2.js ui-v2.js \
            prop-board-v3.js prop-board-v5.js model-lab.js api/*.js \
            workers/nfl-billing/src/index.js

      - name: Syntax gate self-test
        shell: bash
        run: |
          set -euo pipefail
          # The gate must actually reject a broken ESM file. If this starts
          # passing, the syntax step has silently stopped working.
          tmp=$(mktemp -d)
          printf 'import x from "./y.js";\n/* b */15 oops\n' > "$tmp/broken.js"
          if node scripts/check-syntax.mjs "$tmp/broken.js" >/dev/null 2>&1; then
            echo "syntax gate failed to reject a known-broken ESM file"
            exit 1
          fi
          echo "syntax gate correctly rejects broken ESM"

      - name: NFL auth regression suite
        run: node --test tests/nfl-auth*.test.mjs

      - name: Founding Season billing contract
        run: node --test tests/nfl-founding-season-billing.test.mjs

      # research/ holds the contract suites -- odds provider spend, the
      # home-market fallback, and the Prop Board batch merge. No workflow ran
      # them, so a failing case there stayed invisible while every check was
      # green. They run here now.
      - name: Research contract suites
        run: node --test research/*.test.mjs

      - name: Validate Vercel config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      # vercel.json must never regain a directive that can move a production
      # hostname on its own; an "alias" entry here is what let a CLI deploy
      # hand nfl.propbetedge.ai to a project nobody meant to create.
      - name: Deploy target guard
        run: node scripts/verify-deploy-target.mjs --config-only

      - name: Enforce live Prop Board contract
        shell: bash
        run: |
          set -euo pipefail
          # prop-board-v3.js is the Prop Board that actually ships; app.js is dead
          # and was never in index.html's load graph.
          grep -q "const BATCH_SIZE = 5;" prop-board-v3.js
          grep -q "/api/odds/board" prop-board-v3.js
          grep -q "/api/picks/pass" prop-board-v3.js
          for f in prop-board-v3.js model-lab.js dashboard-v7.js pbecast-v6.js nfl-command-center-v1.js what-changed-v1.js best-line-v1.js pbecast-command-v1.js workers/nfl-intel/src/index.js workers/nfl-intel/src/changes-core.js workers/nfl-intel/src/bestline-core.js workers/nfl-intel/src/injuries.js workers/nfl-intel/src/market.js workers/nfl-intel/src/weather.js workers/nfl-replay/src/index.js workers/nfl-replay/src/nflverse.js workers/nfl-billing/src/index.js; do
            ! grep -q "Math.random" "$f"
            ! grep -Eqi "synthetic[_ -]?fallback[[:space:]]*[:=][[:space:]]*true|fake[[:space:]_-]*live" "$f"
          done
          echo "NFL truth contract OK"

      - name: Required application files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s vercel.json
          test -s README.md
          test -s package.json
          test -s workers/nfl-billing/src/index.js
          test -s workers/nfl-billing/wrangler.toml
          # Every file index.html actually loads must exist.
          for f in $(grep -oE 'href="\./[a-z0-9.-]+\.css|src="\./[a-z0-9./-]+\.js' index.html | sed 's/.*"\.\///'); do
            test -s "$f" || { echo "index.html references missing file: $f"; exit 1; }
          done
          # Every file page-loader.js injects must exist.
          for f in $(sed -n '6,220p' page-loader.js | grep -oE "\./[a-z0-9.-]+\.(js|css)" | sed 's|^\./||' | sort -u); do
            test -s "$f" || { echo "page-loader.js injects missing file: $f"; exit 1; }
          done
          echo "Required files OK"
