name: Best Line Integrity UI Fix

on:
  push:
    branches: [fix/bestline-integrity-ui-v1]
    paths:
      - 'scripts/apply-bestline-integrity-ui-fix.mjs'
      - '.github/workflows/bestline-integrity-ui-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bestline-integrity-ui-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply repair
        run: node scripts/apply-bestline-integrity-ui-fix.mjs

      - name: Syntax gate
        run: |
          node scripts/check-syntax.mjs \
            best-line-v1.js best-line-model-overlay-v1.js event-selector-v2.js \
            workers/nfl-intel/src/index.js workers/nfl-intel/src/bestline-core.js \
            tests/nfl-intel-worker.test.mjs research/best-line-model-overlay.test.mjs \
            research/event-selector-timezone.test.mjs

      - name: Focused regression suite
        run: |
          node --test tests/nfl-intel-worker.test.mjs
          node --test research/best-line-model-overlay.test.mjs research/event-selector-timezone.test.mjs

      - name: Commit generated repair
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'Best Line Integrity Repair'
          git config user.email 'sales@localhomebuyersusa.com'
          git add \
            best-line-v1.js best-line-v1.css best-line-model-overlay-v1.js \
            workers/nfl-intel/src/index.js workers/nfl-intel/src/bestline-core.js \
            tests/nfl-intel-worker.test.mjs research/best-line-model-overlay.test.mjs
          git commit -m 'Fix Best Line slate integrity and empty states'
          git push origin HEAD:fix/bestline-integrity-ui-v1
